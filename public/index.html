<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>1 Million Checkboxes</title>
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --green: #00ff88;
        --bg: #0a0a0a;
        --card: #111;
        --border: rgba(0, 255, 136, 0.15);
        --muted: #444;
        --text: #ccc;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family: monospace;
        min-height: 100vh;
        padding: 32px 16px 64px;
      }

      header {
        text-align: center;
        margin-bottom: 24px;
      }
      h1 {
        font-size: 1.4rem;
        color: var(--green);
        letter-spacing: 0.1em;
        margin-bottom: 6px;
      }
      #meta {
        font-size: 0.72rem;
        color: var(--muted);
        display: flex;
        justify-content: center;
        gap: 20px;
      }

      #user-row {
        display: none;
        justify-content: center;
        align-items: center;
        gap: 10px;
        font-size: 0.72rem;
        color: var(--muted);
        margin-bottom: 20px;
      }
      #user-row.visible {
        display: flex;
      }
      #logout-btn {
        background: none;
        border: 1px solid var(--muted);
        color: var(--muted);
        font-family: monospace;
        font-size: 0.7rem;
        padding: 2px 8px;
        cursor: pointer;
        border-radius: 3px;
      }
      #logout-btn:hover {
        border-color: #f55;
        color: #f55;
      }

      #auth-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.9);
        z-index: 50;
        align-items: center;
        justify-content: center;
      }
      #auth-overlay.visible {
        display: flex;
      }
      .auth-box {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 40px 32px;
        text-align: center;
        width: 300px;
      }
      .auth-box p {
        font-size: 0.78rem;
        color: var(--muted);
        margin-bottom: 20px;
        line-height: 1.5;
      }
      #login-btn {
        background: var(--green);
        color: #000;
        border: none;
        font-family: monospace;
        font-size: 0.8rem;
        font-weight: 700;
        padding: 10px 28px;
        cursor: pointer;
        border-radius: 4px;
        letter-spacing: 0.08em;
      }
      #login-btn:hover {
        opacity: 0.85;
      }

      #loading {
        text-align: center;
        padding: 80px 0;
        font-size: 0.8rem;
        color: var(--muted);
      }

      #grid {
        display: none;
        max-width: 960px;
        margin: auto;
        padding: 16px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 8px;
        grid-template-columns: repeat(auto-fill, minmax(28px, 1fr));
        gap: 8px;
      }
      #grid.ready {
        display: grid;
      }

      input[type="checkbox"] {
        width: 20px;
        height: 20px;
        cursor: pointer;
        accent-color: var(--green);
      }
      input[type="checkbox"]:hover {
        outline: 1px solid var(--green);
      }

      #toasts {
        position: fixed;
        bottom: 20px;
        right: 20px;
        display: flex;
        flex-direction: column-reverse;
        gap: 6px;
        z-index: 100;
        pointer-events: none;
        max-width: 260px;
      }
      .toast {
        background: var(--card);
        border: 1px solid var(--border);
        border-left: 2px solid var(--green);
        font-size: 0.72rem;
        padding: 7px 12px;
        border-radius: 4px;
        color: var(--text);
        animation: tin 0.2s ease;
      }
      .toast .name {
        color: var(--green);
      }
      .toast.out {
        animation: tout 0.3s ease forwards;
      }
      @keyframes tin {
        from {
          opacity: 0;
          transform: translateX(16px);
        }
      }
      @keyframes tout {
        to {
          opacity: 0;
          transform: translateX(16px);
        }
      }
    </style>
  </head>
  <body>
    <div id="auth-overlay">
      <div class="auth-box">
        <p>Sign in to join the live checkbox experiment.</p>
        <button id="login-btn">LOGIN</button>
      </div>
    </div>

    <div id="toasts"></div>

    <header>
      <h1>1 MILLION CHECKBOXES</h1>
      <div id="meta">
        <span>● LIVE</span>
        <span id="count">—</span>
      </div>
    </header>

    <div id="user-row">
      <span id="user-name"></span>
      <button id="logout-btn">logout</button>
    </div>

    <div id="loading">loading…</div>
    <div id="grid"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
      const CLIENT_ID = "c9e0d0cbfe811be1150662d4c179439c";
      const AUTH_URL = "http://localhost:8080";
      const API_URL = "http://localhost:8000";

      const store = {
        get: () => {
          try {
            return JSON.parse(localStorage.getItem("tokens"));
          } catch {
            return null;
          }
        },
        set: (v) => localStorage.setItem("tokens", JSON.stringify(v)),
        clear: () => localStorage.removeItem("tokens"),
      };

      async function refreshTokens(refreshToken) {
        const res = await fetch(`${API_URL}/auth/refresh`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ refreshToken }),
        });
        if (!res.ok) throw new Error("Refresh failed");
        const fresh = await res.json();

        const tokens = fresh.data ?? fresh;
        store.set(tokens);
        return tokens;
      }

      function showAuth() {
        document.getElementById("loading").style.display = "none";
        document.getElementById("auth-overlay").classList.add("visible");
      }

      function showUser(info) {
        document.getElementById("user-name").textContent =
          `${info.given_name} ${info.family_name}`;
        document.getElementById("user-row").classList.add("visible");
      }

      function toast(html) {
        const rack = document.getElementById("toasts");
        const el = document.createElement("div");
        el.className = "toast";
        el.innerHTML = html;
        rack.appendChild(el);
        setTimeout(() => {
          el.classList.add("out");
          el.addEventListener("animationend", () => el.remove());
        }, 3000);
      }

      function esc(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      document.getElementById("login-btn").addEventListener("click", () => {
        window.location.href = `${AUTH_URL}/login?clientId=${CLIENT_ID}`;
      });

      document.getElementById("logout-btn").addEventListener("click", () => {
        store.clear();
        window.location.reload();
      });

      (async () => {
        const params = new URLSearchParams(window.location.search);
        const code = params.get("code");
        let tokens = store.get();

        if (!tokens && code) {
          window.history.replaceState({}, "", window.location.pathname);
          try {
            const res = await fetch(`${API_URL}/auth/token`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ code }),
            });
            if (!res.ok) throw new Error();
            const body = await res.json();
            tokens = body.data ?? body;
            store.set(tokens);
          } catch {
            showAuth();
            return;
          }
        }

        if (!tokens) {
          showAuth();
          return;
        }

        let userInfo;
        try {
          let res = await fetch(`${API_URL}/auth/info`, {
            headers: { Authorization: `Bearer ${tokens.id_token}` },
          });

          if (res.status === 401) {
            const fresh = await refreshTokens(tokens.refreshToken);
            tokens = fresh.data ?? fresh;

            res = await fetch(`${API_URL}/auth/info`, {
              headers: { Authorization: `Bearer ${tokens.id_token}` },
            });
          }

          if (!res.ok) throw new Error(`Auth info failed: ${res.status}`);

          const body = await res.json();
          userInfo = body.data ?? body;
        } catch (err) {
          store.clear();
          showAuth();
          return;
        }

        showUser(userInfo);
        const me = {
          id: userInfo.sub,
          name: `${userInfo.given_name} ${userInfo.family_name}`,
        };

        let checkboxs;
        try {
          const res = await fetch(`${API_URL}/checkbox`, {
            headers: { Authorization: `Bearer ${tokens.accessToken}` },
          });
          if (res.status === 401) {
            const fresh = await refreshTokens(tokens.refreshToken);
            tokens = fresh.data ?? fresh;

            res = await fetch(`${API_URL}/auth/info`, {
              headers: { Authorization: `Bearer ${tokens.id_token}` },
            });
          }
          if (!res.ok) throw new Error();
          ({ checkboxs } = await res.json());
        } catch {
          document.getElementById("loading").textContent =
            "failed to load. is the server running?";
          return;
        }

        const grid = document.getElementById("grid");
        const fragment = document.createDocumentFragment();
        let checked = 0;

        const socket = io({ auth: { token: store.get()?.accessToken } });

        checkboxs.forEach((value, index) => {
          const cb = document.createElement("input");
          cb.type = "checkbox";
          cb.id = `cb-${index}`;
          cb.checked = value;
          if (value) checked++;

          cb.addEventListener("change", (e) => {
            socket.emit("client:checkbox:event", {
              isChecked: e.target.checked,
              index,
              userId: me.id,
              displayName: me.name,
            });
          });

          fragment.appendChild(cb);
        });

        grid.appendChild(fragment);
        document.getElementById("loading").style.display = "none";
        grid.classList.add("ready");
        document.getElementById("count").textContent =
          `checked: ${checked.toLocaleString()}`;

        socket.on(
          "server:checkbox:event",
          ({ isChecked, index, userId, displayName }) => {
            const cb = document.getElementById(`cb-${index}`);
            if (!cb) return;

            cb.checked = isChecked;
            checked += isChecked ? 1 : -1;
            document.getElementById("count").textContent =
              `checked: ${checked.toLocaleString()}`;

            if (userId !== me.id) {
              toast(
                `<span class="name">${esc(displayName)}</span> ${isChecked ? "☑" : "☐"} #${index + 1}`,
              );
            }
          },
        );
      })();
    </script>
  </body>
</html>
